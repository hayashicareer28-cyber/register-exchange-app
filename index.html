<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レジ両替システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>レジ両替システム</h1>

  <p class="description">
    各レジのお金の枚数を入力し、「両替指示を作成」を押してください。
  </p>

  <div class="register-area">
    <section class="register-card">
      <h2>1レジ</h2>
      <label>1万円札：<input type="number" id="r1-10000" min="0" step="1">枚</label>
      <label>5000円札：<input type="number" id="r1-5000" min="0" step="1">枚</label>
      <label>1000円札：<input type="number" id="r1-1000" min="0" step="1">枚</label>
      <label>500円玉：<input type="number" id="r1-500" min="0" step="1">枚</label>
      <label>100円玉：<input type="number" id="r1-100" min="0" step="1">枚</label>
      <label>50円玉：<input type="number" id="r1-50" min="0" step="1">枚</label>
      <label>10円玉：<input type="number" id="r1-10" min="0" step="1">枚</label>
      <label>5円玉：<input type="number" id="r1-5" min="0" step="1">枚</label>
      <label>1円玉：<input type="number" id="r1-1" min="0" step="1">枚</label>
    </section>

    <section class="register-card">
      <h2>2レジ</h2>
      <label>1万円札：<input type="number" id="r2-10000" min="0" step="1">枚</label>
      <label>5000円札：<input type="number" id="r2-5000" min="0" step="1">枚</label>
      <label>1000円札：<input type="number" id="r2-1000" min="0" step="1">枚</label>
      <label>500円玉：<input type="number" id="r2-500" min="0" step="1">枚</label>
      <label>100円玉：<input type="number" id="r2-100" min="0" step="1">枚</label>
      <label>50円玉：<input type="number" id="r2-50" min="0" step="1">枚</label>
      <label>10円玉：<input type="number" id="r2-10" min="0" step="1">枚</label>
      <label>5円玉：<input type="number" id="r2-5" min="0" step="1">枚</label>
      <label>1円玉：<input type="number" id="r2-1" min="0" step="1">枚</label>
    </section>

    <section class="register-card">
      <h2>3レジ</h2>
      <label>1万円札：<input type="number" id="r3-10000" min="0" step="1">枚</label>
      <label>5000円札：<input type="number" id="r3-5000" min="0" step="1">枚</label>
      <label>1000円札：<input type="number" id="r3-1000" min="0" step="1">枚</label>
      <label>500円玉：<input type="number" id="r3-500" min="0" step="1">枚</label>
      <label>100円玉：<input type="number" id="r3-100" min="0" step="1">枚</label>
      <label>50円玉：<input type="number" id="r3-50" min="0" step="1">枚</label>
      <label>10円玉：<input type="number" id="r3-10" min="0" step="1">枚</label>
      <label>5円玉：<input type="number" id="r3-5" min="0" step="1">枚</label>
      <label>1円玉：<input type="number" id="r3-1" min="0" step="1">枚</label>
    </section>
  </div>

  <div class="button-area">
    <button onclick="calculate()">両替指示を作成</button>
  </div>

  <div class="result-heading">
    <div>
      <span class="eyebrow">EXCHANGE PLAN</span>
      <h2>両替指示</h2>
    </div>
  </div>

  <div id="result" class="result-box">
    <p class="empty-state">計算後の指示がここに表示されます。</p>
  </div>

  <details class="copy-details">
    <summary>コピー用テキストを確認</summary>
    <pre id="copyText" class="copy-box">ここにコピー用テキストが表示されます。</pre>
  </details>

  <section class="history-section">
    <div class="history-heading">
      <div>
        <span class="eyebrow">SAVED RESULTS</span>
        <h2>保存した結果</h2>
      </div>
      <button type="button" class="history-clear-button" onclick="clearHistory()">履歴をすべて削除</button>
    </div>
    <p class="history-note">計算結果はこのブラウザに自動保存されます（直近20件）。</p>
    <div id="historyList" class="history-list"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
